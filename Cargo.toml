[package]
name = "hispeed-router"
version = "0.1.0"
edition = "2021"
description = "Local, session-sticky OpenAI-compatible model router"
license = "MIT"

[dependencies]
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
